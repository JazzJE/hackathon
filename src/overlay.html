<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>Doodle Do — Desktop canvas</title><link rel="stylesheet" href="overlay.css"></head>
<body>
<img id="desktopImage" alt="Frozen view of the selected display"><div class="tint"></div>
<canvas id="overlayCanvas" aria-label="Draw over your desktop to mark what should happen"></canvas>
<div class="overlay-bar" title="Tab hides tools · Ctrl / ⌘ Enter completes · Esc cancels"><div class="overlay-brand"><b>✳ doodle do.</b><span>DRAW ON YOUR DESKTOP</span></div><div class="overlay-tools"><button id="overlayPen" class="selected" aria-pressed="true">✎ Pen</button><button id="overlayCircle" aria-pressed="false">○ Circle</button><button id="overlayBox" aria-pressed="false">□ Box</button><button id="overlayEraser" aria-pressed="false">▱ Eraser</button><div class="overlay-colors" role="group" aria-label="Link colors: use the same color for an app and its destination" title="Match each app and its destination with the same color · keys 1–5"><span>Link color</span><button class="ink-swatch selected" data-overlay-color="#e14f35" aria-label="Coral ink (1)" aria-pressed="true"></button><button class="ink-swatch" data-overlay-color="#2385ef" aria-label="Blue ink (2)" aria-pressed="false"></button><button class="ink-swatch" data-overlay-color="#20aa70" aria-label="Green ink (3)" aria-pressed="false"></button><button class="ink-swatch" data-overlay-color="#ae65eb" aria-label="Purple ink (4)" aria-pressed="false"></button><button class="ink-swatch" data-overlay-color="#e5ad16" aria-label="Gold ink (5)" aria-pressed="false"></button></div><input id="overlaySize" type="range" min="2" max="16" value="5" aria-label="Brush size"><button id="overlayUndo" aria-label="Undo last stroke">↶ Undo</button><button id="overlayClear">Clear</button></div><div class="overlay-actions"><button id="overlayCancel">Cancel <kbd>Esc</kbd></button><button id="overlayDone" class="complete" disabled>✓ Done <span>Read my drawing</span></button></div></div>
<label class="overlay-hint"><span>Optional hint</span><input id="overlayHint" maxlength="300" placeholder="Optional: blue Messages → blue box…"></label><p id="overlayStatus" role="status" aria-live="polite"></p>
<script src="drawing.js"></script><script src="overlay.js"></script></body></html>
